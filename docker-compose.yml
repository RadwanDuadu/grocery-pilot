services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grocery_pilot
      POSTGRES_USER: grocery_pilot
      POSTGRES_PASSWORD: grocery_pilot_dev
    ports:
      - "5432:5432"
    volumes:
      - grocery-pilot-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_pilot -d grocery_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocery-pilot-data:
